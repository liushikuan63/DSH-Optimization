- id: ultimate-model-memory-example
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: memory
    transport: stdio
    command: node
    args:
      - '<VERIFIED_MEMORY_SERVER_ENTRY>'
    env:
      MEMORY_FILE_PATH: '<APPROVED_MEMORY_DATA_FILE>'
    toolCallTimeoutMs: 60000
    failOnStartupError: true
